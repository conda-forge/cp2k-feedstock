schema_version: 1

context:
  name: cp2k
  version: "2026.2"
  mpi_prefix: "mpi_${{ mpi }}"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://github.com/${{ name }}/${{ name }}/releases/download/v${{ version }}/${{ name }}-${{ version }}.tar.bz2
    sha256: f9bd86f580f57a53a0768c0045d1417f9f9a1d66d851ed7f662f496200043373

build:
  number: 4
  # cp2k.F embeds the build prefix in a Fortran string literal via
  # compiler_options(). Fortran literals are length-counted rather than
  # NUL-terminated, so substituting the prefix at install time shifts the
  # literals packed behind it and corrupts them.
  prefix_detection:
    ignore:
      - bin/cp2k.psmp
  script: build.sh
  string: mpi_${{ mpi }}_h${{ hash }}_${{ build_number }}
  skip:
    - aarch64
    - osx
    - win

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("cxx") }}
    - ${{ compiler("fortran") }}
    - ${{ mpi }}
    - cmake >=3.27
    - ninja >=1.13
    - pkg-config
  host:
    - ${{ mpi }}
    - libboost-python-devel
    - "cosma-scalapack >=2.8 *${{ mpi_prefix }}_*"
    - "dbcsr >=2.10 *${{ mpi_prefix }}_*"
    - eigen
    - "elpa >=2026.02.002 *${{ mpi_prefix }}_*"
    - "fftw * *${{ mpi_prefix }}_*"
    - "hdf5 * *${{ mpi_prefix }}_*"
    - libint
    - libint-fortran-devel
    - "libtorch >=2.12 *cpu_generic_*"
    - "libxc >=7.0 *cpu_*"
    - "libxs ==1.0.0"
    - "libxsmm ==2.0.0"
    - "openblas * *openmp_*"
    - "plumed >=2.10 *${{ mpi_prefix }}_*"
    - scalapack
    - "sirius >=7.11,<7.12 *${{ mpi_prefix }}_*"
    - "spfft >=1.1 ${{ mpi_prefix }}_*"
    - "spla >=1.6 ${{ mpi_prefix }}_*"
    - spglib >=2.7
    # tblite
    - trexio >=2.5
    - zlib
  run:
    - ${{ mpi }}
    - "cosma-scalapack >=2.8 *${{ mpi_prefix }}_*"
    - "dbcsr >=2.10 *${{ mpi_prefix }}_*"
    - "elpa >=2026.02.002 *${{ mpi_prefix }}_*"
    - "fftw >=3.3 *${{ mpi_prefix }}_*"
    - "hdf5 * *${{ mpi_prefix }}_*"
    - "libtorch >=2.12 *cpu_generic_*"
    - "libxs ==1.0.0"
    - "libxsmm ==2.0.0"
    - "openblas * *openmp_*"
    - "plumed >=2.10 *${{ mpi_prefix }}_*"
    - "sirius >=7.11,<7.12 *${{ mpi_prefix }}_*"
    - "spfft >=1.1 ${{ mpi_prefix }}_*"
    - "spla >=1.6 ${{ mpi_prefix }}_*"
    - trexio >=2.5

tests:
  - package_contents:
      bin:
        - cp2k.psmp
        - cp2k.popt
        - cp2k
      lib:
        - libcp2k
  - script:
      - cp2k -h -v

about:
  homepage: https://www.cp2k.org
  license: GPL-2.0-only
  license_family: GPL
  license_file: LICENSE
  summary: Quantum chemistry and solid state physics software package
  description: |
    CP2K is a quantum chemistry and solid state physics software package
    that can perform atomistic simulations of solid state, liquid,
    molecular, periodic, material, crystal, and biological systems.
  documentation: https://manual.cp2k.org
  repository: https://github.com/cp2k/cp2k

extra:
  recipe-maintainers:
    - jan-janssen
    - oschuett
    - mkrack
